services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "20MB"
    networks:
      - rinha

  api-1:
    image: gaelos7k/rinha-2026:latest
    environment:
      - PORT=9999
      - DEBUG_LOAD=${DEBUG_LOAD:-0}
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    networks:
      - rinha

  api-2:
    image: gaelos7k/rinha-2026:latest
    environment:
      - PORT=9999
      - DEBUG_LOAD=${DEBUG_LOAD:-0}
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge